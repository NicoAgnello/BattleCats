<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Battle Royale 2D - Battle Cats</title>
    
    <!-- Google Web Fonts & Material Symbols 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    
    <!-- Google Web Model-Viewer 3 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- Pantalla de carga: se ve apenas llega el HTML, antes de bajar el JS.
         React la reemplaza al montar <App /> dentro de #root. -->
    <style>
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(ellipse at center, #231b2b 0%, #0b0810 75%);
        font-family: 'Pixelify Sans', 'Outfit', monospace;
        color: #f1ead8;
      }
      #boot .boot-cat {
        width: 192px; height: 240px;
        background: url("/sprites/retrato-sargento.png") 0 0 / 3072px 240px no-repeat;
        image-rendering: pixelated;
        animation: boot-cat 2.4s steps(16) infinite;
      }
      @keyframes boot-cat { to { background-position: -3072px 0; } }
      #boot h1 {
        margin: 0; font-size: 56px; font-weight: 700; letter-spacing: 0.02em;
        text-shadow:
          -4px 0 0 #14101c, 4px 0 0 #14101c, 0 -4px 0 #14101c, 0 4px 0 #14101c,
          -4px -4px 0 #14101c, 4px -4px 0 #14101c, -4px 4px 0 #14101c, 4px 4px 0 #14101c,
          0 8px 0 #14101c;
      }
      #boot h1 span { color: #00b2e1; }
      #boot .boot-bar {
        width: 220px; height: 14px;
        background: #3a3a44; border: 3px solid #14101c; overflow: hidden;
      }
      #boot .boot-bar div {
        width: 40%; height: 100%; background: #5dcbfa;
        animation: boot-bar 1.1s steps(12) infinite alternate;
      }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      #boot p { margin: 0; font-size: 15px; color: #9d93ad; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden select-none font-sans" style="background:#0b0810">
    <div id="root">
      <div id="boot">
        <div class="boot-cat"></div>
        <h1>BATTLE <span>CATS</span></h1>
        <div class="boot-bar"><div></div></div>
        <p>Cargando...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
